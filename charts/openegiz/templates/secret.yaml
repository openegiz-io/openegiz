{{- if not .Values.credentials.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "openegiz.secretName" . }}
  labels:
    {{- include "openegiz.labels" . | nindent 4 }}
type: Opaque
stringData:
  ditto-password: {{ .Values.credentials.dittoPassword | quote }}
  ditto-devops-password: {{ .Values.credentials.dittoDevopsPassword | quote }}
  grafana-admin-password: {{ .Values.credentials.grafanaAdminPassword | quote }}
  influxdb-admin-password: {{ .Values.credentials.influxdbAdminPassword | quote }}
  influxdb-token: {{ .Values.credentials.influxdbToken | quote }}
  {{- if .Values.mosquitto.auth.enabled }}
  mqtt-username: {{ .Values.credentials.mqttUsername | quote }}
  mqtt-password: {{ .Values.credentials.mqttPassword | quote }}
  {{- end }}
  {{- if .Values.extendedApi.auth.enabled }}
  extended-api-auth-token: {{ .Values.credentials.extendedApiAuthToken | quote }}
  {{- end }}
{{- end }}
