apiVersion: v1
kind: Service
metadata:
  name: {{ include "openegiz.extendedApi.fullname" . }}
  labels:
    {{- include "openegiz.componentLabels" (dict "context" . "component" "extended-api") | nindent 4 }}
spec:
  type: {{ .Values.extendedApi.service.type }}
  ports:
    - name: http
      port: {{ .Values.extendedApi.service.port }}
      targetPort: http
      protocol: TCP
  selector:
    {{- include "openegiz.componentSelectorLabels" (dict "context" . "component" "extended-api") | nindent 4 }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "openegiz.extendedApi.fullname" . }}
  labels:
    {{- include "openegiz.componentLabels" (dict "context" . "component" "extended-api") | nindent 4 }}
spec:
  replicas: 1
  selector:
    matchLabels:
      {{- include "openegiz.componentSelectorLabels" (dict "context" . "component" "extended-api") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "openegiz.componentLabels" (dict "context" . "component" "extended-api") | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      initContainers:
        # Wait for MongoDB before starting Express/Mongoose: Mongoose does not
        # exit the process when its initial connect fails, which would leave
        # /api/policies permanently broken if MongoDB was still starting.
        - name: wait-for-mongodb
          image: "{{ .Values.extendedApi.image.repository }}:{{ .Values.extendedApi.image.tag }}"
          imagePullPolicy: {{ .Values.extendedApi.image.pullPolicy }}
          command:
            - /bin/sh
            - -ec
            - |
              echo "Waiting for MongoDB at {{ include "openegiz.mongodb.fullname" . }}:{{ .Values.mongodb.service.port }}..."
              until nc -z -w 3 "{{ include "openegiz.mongodb.fullname" . }}" "{{ .Values.mongodb.service.port }}"; do
                sleep 2
              done
              echo "MongoDB is reachable."
      containers:
        - name: extended-api
          image: "{{ .Values.extendedApi.image.repository }}:{{ .Values.extendedApi.image.tag }}"
          imagePullPolicy: {{ .Values.extendedApi.image.pullPolicy }}
          env:
            - name: HOST
              value: {{ include "openegiz.extendedApi.fullname" . | quote }}
            - name: PORT
              value: "8080"
            - name: MONGO_URI_POLICIES
              value: "mongodb://{{ include "openegiz.mongodb.fullname" . }}:{{ .Values.mongodb.service.port }}/ditto"
            - name: DITTO_URI_THINGS
              value: "http://{{ include "openegiz.ditto.nginx.fullname" . }}:{{ .Values.ditto.nginx.service.port }}"
            - name: DITTO_USERNAME_API
              value: "ditto"
            - name: DITTO_PASSWORD_API
              valueFrom:
                secretKeyRef:
                  name: {{ include "openegiz.secretName" . }}
                  key: ditto-password
            - name: DITTO_USERNAME_DEVOPS
              value: "devops"
            - name: DITTO_PASSWORD_DEVOPS
              valueFrom:
                secretKeyRef:
                  name: {{ include "openegiz.secretName" . }}
                  key: ditto-devops-password
            - name: ALL_LOGS
              value: {{ .Values.extendedApi.allLogs | quote }}
            - name: AUTH_ENABLED
              value: {{ .Values.extendedApi.auth.enabled | quote }}
            {{- if .Values.extendedApi.auth.enabled }}
            - name: AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: {{ include "openegiz.secretName" . }}
                  key: extended-api-auth-token
                  optional: true
            {{- end }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          readinessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: http
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.extendedApi.resources | nindent 12 }}
