apiVersion: 1
datasources:
  - name: openegiz
    uid: openegiz-influxdb
    type: influxdb
    access: proxy
    url: http://influxdb:8086
    isDefault: true
    jsonData:
      version: Flux
      organization: openegiz
      defaultBucket: default
    secureJsonData:
      token: $INFLUXDB_TOKEN
