# Production Profile Mosquitto configuration: authentication required.
# Loaded by entrypoint-prod.sh after generating /tmp/mosquitto.passwd.
per_listener_settings false
listener 1883 0.0.0.0
allow_anonymous false
password_file /tmp/mosquitto.passwd
log_dest stdout
log_type error
log_type warning
log_type notice
log_timestamp true
persistence true
persistence_location /mosquitto/data/
