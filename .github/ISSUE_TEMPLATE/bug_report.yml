name: Bug report
description: Something does not install, start or work as the README says
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Remove credentials and private host details before pasting logs or commands.
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options:
        - Docker Compose Dev Profile
        - Docker Compose Production Profile
        - Helm Dev Profile
        - Helm Production Profile
        - Other
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: OpenEgiz version
      description: Release tag or commit from `git describe --tags --always`
      placeholder: v2.0.0-rc.1
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What you ran and what happened
      description: Exact commands, the error text, and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: |
        Include OS and CPU architecture, Docker and Compose versions for Compose,
        or Kubernetes distribution and Helm version for Kubernetes.
      render: text
    validations:
      required: true
  - type: textarea
    id: status
    attributes:
      label: Service status and logs
      description: Include relevant output from `make ps` and `make logs S=<service>`, or from `kubectl` for Helm.
      render: text
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues for this problem
          required: true
        - label: I removed passwords and tokens from everything above
          required: true
